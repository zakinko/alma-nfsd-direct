name: RHEL 9 kernel with block-layer prerequisites and nfsd direct I/O

on:
  push:
    branches: [main]
    paths: ['el9k/**', '.github/workflows/el9k.yml']
  workflow_dispatch:
    inputs:
      measure:
        description: run the NFS measurement
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # 36: upstream mainline only; 46: with the fixes queued in nfsd-testing
        limit: [36, 46]
    steps:
      - uses: actions/checkout@v4
      - name: Boot AlmaLinux 9
        run: sh mainline/boot.sh
        env:
          IMG: https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-latest.x86_64.qcow2
          UD: el9k/user-data
          READY: test -f /var/tmp/ready
      - name: Build the kernel
        run: |
          cd $W
          scp -q -r -i key -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $GITHUB_WORKSPACE/el9k $GITHUB_WORKSPACE/el9/run.sh $GITHUB_WORKSPACE/el9/bvec.bt $GITHUB_WORKSPACE/el9/dioal.sh $GITHUB_WORKSPACE/el9/dioal.c $GITHUB_WORKSPACE/el9/unaligned.sh $GITHUB_WORKSPACE/el9/rdmarep.sh root@127.0.0.1:/root/
          $S 'LIMIT=${{ matrix.limit }} sh /root/el9k/build.sh'
      - name: Reboot into it
        run: |
          cd $W
          $S 'systemctl reboot' || true
          sleep 30
          for i in $(seq 1 60); do $S 'uname -r | grep -q -- -nd' && break; sleep 10; done
          $S 'uname -r'
      - name: Measure
        if: github.event_name != 'workflow_dispatch' || inputs.measure
        run: |
          cd $W
          $S 'EL9K=1 sh /root/run.sh'
      - name: Misaligned direct I/O on dm and md
        run: |
          cd $W
          $S 'sh /root/dioal.sh'
      - name: Unaligned READs
        if: always()
        timeout-minutes: 40
        run: |
          cd $W
          $S 'sh /root/unaligned.sh' || { $S 'dmesg | tail -60'; exit 1; }
      - name: Repeated direct READs over RDMA and TCP
        if: always()
        timeout-minutes: 60
        run: |
          cd $W
          $S 'sh /root/rdmarep.sh' || { $S 'dmesg | tail -60'; exit 1; }
